spring.application.name=lifeos-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/lifeos
spring.datasource.username=lifeos
spring.datasource.password=lifeos_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# JWT_SECRET fallback is only for local development. Set a unique secret (32+ bytes) in real environments.
jwt.secret=${JWT_SECRET:lifeos-development-secret-key-2026-very-secure}
jwt.expiration=${JWT_EXPIRATION:86400000}
